[package]
name = "cosmic-ext-applet-container-manager"
version = "0.1.1"
edition = "2024"
authors = ["Frederic Laing <dev@fredfunk.tech>"]
license = "GPL-3.0-only"
description = "A COSMIC™ Desktop panel applet for managing Docker and Podman containers"

[features]
flatpak = []

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10.1"
nix = { version = "0.31.3", features = ["fs", "signal"] }
rust-embed = "8.13"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "time"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["applet", "applet-token", "tokio", "wayland", "winit"]
