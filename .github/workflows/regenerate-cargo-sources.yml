name: Regenerate Cargo Sources

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-cargo-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and commit Flatpak Cargo sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install generator dependencies
        run: pip install aiohttp tomlkit

      - name: Regenerate Cargo sources
        run: just flatpak-cargo-sources

      - name: Commit regenerated sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flatpak/cargo-sources.json

          if git diff --staged --quiet; then
            echo "Cargo sources are already current."
          else
            git commit -m "Regenerate Flatpak Cargo sources"
            git push origin "${{ github.ref_name }}"
          fi
